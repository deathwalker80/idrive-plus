plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// chiave di caricamento per Google Play: app/keystore.properties (fuori dal repository) con
//   storeFile=percorso del .jks   storePassword=...   keyAlias=...   keyPassword=...
// senza quel file la release si firma con la chiave di debug (va bene solo per provarla)
def chiavi = new Properties()
def fileChiavi = rootProject.file("keystore.properties")
if (fileChiavi.exists()) fileChiavi.withInputStream { chiavi.load(it) }

android {
    namespace 'it.deathwalker.idriveponte'
    compileSdk 36

    defaultConfig {
        // un'app sola per MINI, BMW e Supra: la marca si riconosce dal Bluetooth dell'auto (Marca.kt)
        applicationId "it.deathwalker.nbtplus"
        minSdk 26
        targetSdk 36
        versionCode 320
        versionName "3.2"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (fileChiavi.exists()) {
            play {
                storeFile rootProject.file(chiavi["storeFile"])
                storePassword chiavi["storePassword"]
                keyAlias chiavi["keyAlias"]
                keyPassword chiavi["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig fileChiavi.exists() ? signingConfigs.play : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// nome dei file: NBTPlus-<versione>-release.apk e .aab
base {
    archivesName = "NBTPlus-" + android.defaultConfig.versionName
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
